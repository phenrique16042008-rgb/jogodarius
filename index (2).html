<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NBA Bounce - Platformer</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;font-family:'Segoe UI',Tahoma,sans-serif;display:flex;justify-content:center;align-items:center;color:#fff}
#game{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;overflow:hidden;background:#000;box-shadow:0 10px 30px #000c}
canvas{width:100%;height:100%;display:block}
.touch{display:none;position:absolute;bottom:10px;left:0;right:0;padding:0 14px;justify-content:space-between;pointer-events:none;z-index:5}
.grp{display:flex;gap:10px;pointer-events:auto}
.b{width:54px;height:54px;border-radius:50%;background:#fff3;border:2px solid #fff6;display:flex;align-items:center;justify-content:center;font-size:20px;touch-action:none}
.b.l{width:64px;height:64px;background:#fdb92766}
.b:active{background:#fff8}
@media(pointer:coarse){.touch{display:flex}}
</style></head><body>
<div id="game">
  <canvas id="c" width="960" height="540"></canvas>
  <input id="code" maxlength="6" placeholder="CÓDIGO" autocomplete="off" style="display:none;position:absolute;left:35.4%;top:61.1%;width:16.7%;height:8.2%;font:bold 20px sans-serif;text-align:center;text-transform:uppercase;border-radius:8px;border:2px solid #fff;background:#0f172a;color:#fff;user-select:text;-webkit-user-select:text;z-index:6">
  <div class="touch">
    <div class="grp"><div class="b" id="bL">◄</div><div class="b" id="bR">►</div></div>
    <div class="grp"><div class="b l" id="bS">🏀</div><div class="b l" id="bJ">▲</div></div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   NBA BOUNCE - Plataforma 2D (HTML5 Canvas, JS puro, arquivo único)
   ===================================================================== */

/* ---------- 1. CONFIGURAÇÃO BÁSICA ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 460;
const GAME_STATE = { MENU:'MENU', SELECTION:'SELECTION', PLAYING:'PLAYING', DUNK_MINIGAME:'DUNK_MINIGAME', GAME_OVER:'GAME_OVER', VICTORY:'VICTORY', LOBBY:'LOBBY', RACE_END:'RACE_END' };
const S = GAME_STATE;
let state = S.MENU, frame = 0;

/* ---------- 2. ÁUDIO (Web Audio API, sons sintetizados) ---------- */
const sfx = {
  ac: null,
  init() {
    if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ac = new A(); }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone(f1, f2, d, type = 'sine', v = .25) {
    const a = this.ac; if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
  },
  jump() { this.tone(150, 400, .15) }, shoot() { this.tone(300, 120, .2, 'triangle') },
  coin() { this.tone(988, 1318, .2) }, hit() { this.tone(120, 40, .25, 'sawtooth', .35) },
  swish() { this.tone(523, 880, .3) }, stomp() { this.tone(200, 80, .12, 'square', .2) },
  rim() { this.tone(300, 150, .2, 'square', .2) }
};

/* ---------- 3. DADOS: JOGADORES E TEMAS ---------- */
const PLAYERS = [
  { name:'LeBron',  team:'Lakers',    c1:'#552583', c2:'#FDB927', n:'23', speed:4.8, jump:12.5, shoot:1.0, skin:'#8d5524' },
  { name:'Curry',   team:'Warriors',  c1:'#1D428A', c2:'#FFC72C', n:'30', speed:5.2, jump:11.5, shoot:1.5, skin:'#a0673a' },
  { name:'Jordan',  team:'Bulls',     c1:'#CE1141', c2:'#000000', n:'23', speed:5.0, jump:13.5, shoot:1.1, skin:'#6b4423' },
  { name:'Giannis', team:'Bucks',     c1:'#00471B', c2:'#EEE1C9', n:'34', speed:5.1, jump:13.0, shoot:0.9, skin:'#6b4423' },
  { name:'Tatum',   team:'Celtics',   c1:'#007A33', c2:'#FFFFFF', n:'0',  speed:4.9, jump:12.0, shoot:1.2, skin:'#8d5524' },
  { name:'Luka',    team:'Mavericks', c1:'#00538C', c2:'#002B5E', n:'77', speed:4.6, jump:11.2, shoot:1.4, skin:'#e0ac69' },
  { name:'KD',      team:'Suns',      c1:'#E03A3E', c2:'#1D1160', n:'35', speed:4.9, jump:12.8, shoot:1.4, skin:'#8d5524' },
  { name:'Butler',  team:'Heat',      c1:'#98002E', c2:'#000000', n:'22', speed:4.8, jump:12.2, shoot:1.0, skin:'#6b4423' },
  { name:'Ja',      team:'Grizzlies', c1:'#5D76A9', c2:'#F5B112', n:'12', speed:5.5, jump:13.8, shoot:0.9, skin:'#6b4423' },
  { name:'Jokic',   team:'Nuggets',   c1:'#0E2240', c2:'#FEC524', n:'15', speed:4.4, jump:11.0, shoot:1.3, skin:'#e0ac69' }
];
const THEMES = [
  { key:'STREET', name:'Quadra de Rua',   sky:['#2b2b3a','#4a4a60'], floor:'#3a3a44', top:'#6b6b78' },
  { key:'PARK',   name:'Quadra de Parque', sky:['#69c0f0','#d6f0ff'], floor:'#2f7d66', top:'#3fa07f' },
  { key:'ARENA',  name:'Arena NBA',        sky:['#0a1226','#1b2a52'], floor:'#a56a36', top:'#d89a5c' }
];
const CONF = ['#ffd700', '#ff0055', '#00e676', '#40c4ff'];

/* ---------- 4. ESTADO GLOBAL DO JOGO ---------- */
let selP = 0, selT = 0;
let player, cam = 0, level = 1, score = 0, lives = 3, timeLeft = 0, timeMax = 0, banner = 0;
let plats = [], enemies = [], items = [], shots = [], parts = [], hoop = null, dk = null;
let seed = 1;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; // RNG com semente: fases sempre iguais

/* ---------- 5. HELPERS DE DESENHO ---------- */
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); };
const txt = (s, x, y, size = 20, col = '#fff', al = 'center', wt = 'bold') => { ctx.font = `${wt} ${size}px sans-serif`; ctx.fillStyle = col; ctx.textAlign = al; ctx.fillText(s, x, y); };
const btn = (x, y, w, h, col, label, size) => { ctx.fillStyle = col; rr(x, y, w, h, 12); txt(label, x + w / 2, y + h / 2 + size * .35, size); };
const hit = (ax, ay, aw, ah, o) => ax < o.x + o.w && ax + aw > o.x && ay < o.y + o.h && ay + ah > o.y;

function drawBall(x, y, r, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.beginPath();
  ctx.arc(0, 0, r, 0, 7); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.restore();
}
// Troféu Larry O'Brien (origem = base do troféu)
function drawTrophy(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#b8860b'; ctx.fillRect(-28, -8, 56, 8);
  ctx.fillStyle = '#ffd700'; ctx.fillRect(-24, -18, 48, 10);
  ctx.beginPath(); ctx.moveTo(-8, -50); ctx.lineTo(8, -50); ctx.lineTo(5, -18); ctx.lineTo(-5, -18); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -70, 20, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.arc(0, -70, 20, 0, 7); ctx.moveTo(-20, -70); ctx.lineTo(20, -70); ctx.moveTo(0, -90); ctx.lineTo(0, -50); ctx.stroke();
  ctx.restore();
}
// Sprite procedural do jogador (usado no jogo, seleção e vitória)
function drawPlayer(d, x, y, face = 1, anim = 0, up = false, s = 1) {
  ctx.save(); ctx.translate(x + 18 * s, y); ctx.scale(face * s, s);
  const sw = Math.sin(anim) * 5;
  ctx.fillStyle = '#222'; ctx.fillRect(-10 + sw, 44, 7, 8); ctx.fillRect(3 - sw, 44, 7, 8);
  ctx.fillStyle = '#fff'; ctx.fillRect(-11 + sw, 50, 11, 4); ctx.fillRect(2 - sw, 50, 11, 4);
  ctx.strokeStyle = d.skin; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
  if (up) { const t = up === 'trophy' ? 6 : 22; ctx.moveTo(-14, 24); ctx.lineTo(-t, -10); ctx.moveTo(14, 24); ctx.lineTo(t, -10); }
  else { ctx.moveTo(-14, 24); ctx.lineTo(-17, 38 - sw); ctx.moveTo(14, 24); ctx.lineTo(17, 38 + sw); }
  ctx.stroke();
  ctx.fillStyle = d.c1; rr(-14, 18, 28, 28, 6);
  ctx.fillStyle = d.c2; ctx.fillRect(-14, 18, 4, 28); ctx.fillRect(10, 18, 4, 28); ctx.fillRect(-14, 42, 28, 4);
  ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(0, 10, 9, 0, 7); ctx.fill();
  ctx.fillStyle = d.c2; ctx.fillRect(-9, 5, 18, 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(2, 9, 4, 3); ctx.fillStyle = '#000'; ctx.fillRect(4, 9, 2, 3);
  ctx.scale(face, 1); txt(d.n, 0, 36, 12); // desfaz o espelhamento para o número ficar legível
  if (up === 'trophy') drawTrophy(0, -12 + Math.sin(frame * .1) * 2, .6);
  ctx.restore();
}

/* ---------- 6. ENTIDADES ---------- */
class Player {
  constructor(d) { this.d = d; this.w = 36; this.h = 54; this.safe = { x: 100, y: GROUND - 54 }; this.respawn(); this.inv = 0; this.up = false; this.anim = 0; this.cd = 0; this.face = 1; }
  respawn() { this.x = this.safe.x; this.y = this.safe.y; this.vx = this.vy = 0; this.jumps = 0; this.inv = 120; this.ground = false; }
  update() {
    const d = this.d;
    if (keys.left) { this.vx = -d.speed; this.face = -1; } else if (keys.right) { this.vx = d.speed; this.face = 1; } else this.vx *= .8;
    this.vy = Math.min(this.vy + .5, 14);
    this.x = Math.max(0, this.x + this.vx);
    const prev = this.y + this.h; this.y += this.vy; this.ground = false;
    for (const p of plats) { // plataformas "one-way": só colide por cima
      if (this.vy >= 0 && this.x + this.w > p.x + 4 && this.x < p.x + p.w - 4 && prev <= p.y + 6 && this.y + this.h >= p.y) {
        this.y = p.y - this.h; this.vy = 0; this.ground = true; this.jumps = 0; this.x += p.dx;
        if (!p.vx) this.safe = { x: Math.max(p.x + 20, Math.min(this.x, p.x + p.w - this.w - 20)), y: p.y - this.h }; // checkpoint
      }
    }
    if (!this.ground && this.jumps === 0) this.jumps = 1; // caiu da borda: já gastou o 1º pulo
    if (this.ground) this.anim += Math.abs(this.vx) * .15;
    if (this.inv > 0) this.inv--; if (this.cd > 0) this.cd--;
    if (this.y > H + 60) this.hurt(true);
  }
  jump() { if (mp && mp.cd > 0) return; if (this.jumps < 2) { this.vy = -this.d.jump; this.jumps++; sfx.jump(); } } // pulo duplo
  shoot() {
    if (this.cd > 0 || (mp && mp.cd > 0)) return;
    shots.push(new Ball('p', this.x + 18 + this.face * 20, this.y + 20, this.face * 9, -1.5));
    this.cd = Math.round(25 / this.d.shoot); sfx.shoot();
  }
  hurt(fall) {
    sfx.hit(); lives--;
    if (lives <= 0) { state = S.GAME_OVER; return; }
    if (fall) this.respawn(); else { this.inv = 90; this.vy = -7; this.vx = -this.face * 5; }
  }
  draw() {
    ctx.save(); if (this.inv > 0 && frame % 8 < 4) ctx.globalAlpha = .4;
    drawPlayer(this.d, this.x - cam, this.y, this.face, this.anim, this.up, 1); ctx.restore();
  }
}
class Ball { // bola de basquete: 'p' = jogador, 'e' = inimigo
  constructor(own, x, y, vx, vy) { Object.assign(this, { own, x, y, vx, vy, r: 8, rot: 0, alive: true }); }
  update() {
    this.x += this.vx; this.vy += this.own === 'p' ? .2 : .1; this.y += this.vy; this.rot += .25;
    if (this.x < cam - 80 || this.x > cam + W + 80 || this.y > H) this.alive = false;
  }
  draw() { drawBall(this.x - cam, this.y, this.r, this.rot, this.own === 'p' ? '#e65c00' : '#7b1fa2'); }
}
class Enemy { // 'goomba' = defensor que patrulha; 'koopa' = arremessador
  constructor(x, y, type, lo, hi) { Object.assign(this, { x, y, type, lo, hi, w: 32, h: 32, t: 0, dead: false, vx: type === 'koopa' ? -.8 : -(1.2 + level * .08) }); }
  update() {
    this.x += this.vx;
    if (this.x < this.lo) { this.x = this.lo; this.vx = Math.abs(this.vx); } else if (this.x > this.hi) { this.x = this.hi; this.vx = -Math.abs(this.vx); }
    if (this.type === 'koopa' && ++this.t > 110 && Math.abs(player.x - this.x) < 420) {
      this.t = 0; shots.push(new Ball('e', this.x + 16, this.y + 8, (player.x < this.x ? -1 : 1) * 4.5, -1));
    }
  }
  draw() {
    const k = this.type === 'koopa', x = this.x - cam, y = this.y, f = this.vx < 0 ? -1 : 1;
    ctx.fillStyle = k ? '#4a148c' : '#b30000'; rr(x, y + 12, 32, 20, 6);
    ctx.fillStyle = k ? '#ffb300' : '#fff'; ctx.fillRect(x + 4, y + 20, 24, 3);
    ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.arc(x + 16, y + 9, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 16 + f * 3 - 3, y + 6, 6, 4); ctx.fillStyle = '#000'; ctx.fillRect(x + 16 + f * 4 - 1, y + 7, 2, 3);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 7, y + 3); ctx.lineTo(x + 25, y + 6); ctx.stroke(); // sobrancelha brava
    if (k) drawBall(x + 16 - f * 12, y + 22, 6, 0, '#7b1fa2');
  }
}
class Item { // 'coin' = bola dourada (+pontos); 'energy' = energético (+vida)
  constructor(x, y, type) { Object.assign(this, { x, y, type, w: 20, h: 20, ph: Math.random() * 6, got: false }); }
  draw() {
    const x = this.x - cam, y = this.y + Math.sin(frame * .07 + this.ph) * 4;
    if (this.type === 'coin') drawBall(x + 10, y + 10, 10, frame * .05, '#ffd700');
    else { ctx.fillStyle = '#00e676'; ctx.fillRect(x + 4, y + 3, 12, 16); ctx.fillStyle = '#fff'; ctx.fillRect(x + 7, y, 6, 3); txt('+', x + 10, y + 15, 11, '#003'); }
  }
}

/* ---------- 7. PARTÍCULAS E CONFETES ---------- */
function spawn(x, y, col, n = 10) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 6, vy: (Math.random() - .5) * 6, col, life: 30, max: 30, g: 0 });
}
function confetti(x, y, n, rain) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * (rain ? 2 : 10), vy: rain ? 1 + Math.random() * 2 : -Math.random() * 8 - 2,
    col: CONF[i % 4], life: rain ? 260 : 140, max: 60, rect: 1, rot: Math.random() * 6, g: rain ? .02 : .18 });
}
function updateParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; if (p.rect) p.rot += .2; p.life--; }
  parts = parts.filter(p => p.life > 0 && p.y < H + 20);
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.life / p.max); ctx.fillStyle = p.col;
    if (p.rect) { ctx.save(); ctx.translate(p.x - cam, p.y); ctx.rotate(p.rot); ctx.fillRect(-4, -2.5, 8, 5); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x - cam, p.y, 3, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 8. GERAÇÃO DE FASES (10 níveis, dificuldade progressiva) ---------- */
function loadLevel(n) {
  level = n; seed = n * 7919 + 13;
  plats = []; enemies = []; items = []; shots = []; parts = [];
  player = new Player(PLAYERS[selP]); cam = 0; banner = 120;
  timeMax = 100 + n * 8; timeLeft = timeMax;
  const len = 2200 + n * 350; let x = 0; const ground = [];
  // Chão com buracos: o tamanho do buraco cresce com o nível, mas sempre é pulável
  while (x < len) {
    const w = 280 + (rnd() * 200 | 0), g = { x, y: GROUND, w, h: 80, vx: 0, dx: 0 };
    plats.push(g); ground.push(g); x += w;
    if (x < len - 300) x += 70 + n * 6 + (rnd() * 30 | 0);
  }
  plats.push({ x: len - 50, y: GROUND, w: 520, h: 80, vx: 0, dx: 0 }); // área da cesta
  for (const g of ground) { // moedas e defensores no chão
    if (rnd() < .7) for (let i = 0; i < 3; i++) items.push(new Item(g.x + 40 + i * 30, GROUND - 70, 'coin'));
    if (g.x > 300 && rnd() < .4 + n * .05) enemies.push(new Enemy(g.x + g.w / 2, GROUND - 32, rnd() < .3 ? 'koopa' : 'goomba', g.x, g.x + g.w - 32));
  }
  for (let px = 500; px < len - 300; px += 260 + (rnd() * 80 | 0)) { // plataformas elevadas
    const py = GROUND - 110 - (rnd() * 110 | 0), w = 110 + (rnd() * 60 | 0), mv = n >= 3 && rnd() < .3;
    plats.push({ x: px, y: py, w, h: 20, vx: mv ? 1 + n * .08 : 0, dx: 0, ox: px, rng: 70 }); // obstáculos móveis a partir do nível 3
    if (mv) continue;
    if (rnd() < .7) items.push(new Item(px + w / 2 - 10, py - 34, rnd() < .88 ? 'coin' : 'energy'));
    if (rnd() < .25 + n * .04) enemies.push(new Enemy(px + 10, py - 32, rnd() < .3 ? 'koopa' : 'goomba', px, px + w - 32));
  }
  hoop = { x: len + 260, y: 330 };
  state = S.PLAYING;
}
function startGame() { score = 0; lives = 3; loadLevel(1); }

/* ---------- 9. ATUALIZAÇÃO DO GAMEPLAY ---------- */
function updatePlaying() {
  if (mp) { if (mp.cd > 0) { mp.cd--; return; } mp.rt++; } // contagem regressiva da corrida
  for (const p of plats) { p.dx = 0; if (p.vx) { p.x += p.vx; p.dx = p.vx; if (Math.abs(p.x - p.ox) > p.rng) p.vx *= -1; } }
  if (keys.shoot) player.shoot();
  player.update(); if (state !== S.PLAYING) return;
  cam = Math.max(0, player.x - 260);
  if (banner > 0) banner--;
  if ((timeLeft -= 1 / 60) <= 0) { timeLeft = timeMax; player.hurt(true); if (state !== S.PLAYING) return; } // tempo esgotado = perde vida
  shots.forEach(b => b.update());
  for (const b of shots) {
    if (!b.alive) continue;
    if (b.own === 'p') {
      for (const e of enemies) if (!e.dead && hit(b.x - 8, b.y - 8, 16, 16, e)) { e.dead = true; b.alive = false; score += 200; sfx.stomp(); spawn(e.x + 16, e.y + 16, '#f44', 12); }
    } else if (player.inv <= 0 && hit(b.x - 8, b.y - 8, 16, 16, player)) { b.alive = false; player.hurt(false); }
  }
  shots = shots.filter(b => b.alive);
  for (const e of enemies) {
    if (e.dead) continue; e.update();
    if (hit(player.x, player.y, player.w, player.h, e)) {
      if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 14) { // pulo na cabeça
        e.dead = true; player.vy = -9; player.jumps = 1; score += 100; sfx.stomp(); spawn(e.x + 16, e.y + 16, '#ff0', 12);
      } else if (player.inv <= 0) player.hurt(false);
    }
  }
  enemies = enemies.filter(e => !e.dead);
  for (const it of items) if (!it.got && hit(player.x, player.y, player.w, player.h, it)) {
    it.got = true; spawn(it.x + 10, it.y + 10, '#ffd700');
    if (it.type === 'coin') { score += 50; sfx.coin(); } else { lives = Math.min(lives + 1, 5); sfx.swish(); }
  }
  items = items.filter(i => !i.got);
  if (state === S.PLAYING && player.x >= hoop.x - 260) startDunk();
}

/* ---------- 10. MINIGAME DE ENTERRADA (barra estilo NBA 2K) ---------- */
function startDunk() {
  state = S.DUNK_MINIGAME; player.x = hoop.x - 230; player.y = GROUND - player.h; player.vx = player.vy = 0; player.face = 1;
  cam = hoop.x - 620; shots = []; newShot();
}
function newShot() { // zona verde menor e ponteiro mais rápido conforme o nível; "taxa de arremesso" do jogador ajuda
  const zw = Math.max(.07, (.18 - level * .009) * (.8 + .2 * player.d.shoot)), z0 = .4 + Math.random() * (.55 - zw);
  dk = { ph: 'aim', m: 0, dir: 1, sp: .014 + level * .0023, z0, z1: z0 + zw, t: 0, ok: false, bx: 0, by: 0, bvx: 0, bvy: 0, wob: 0, wait: 0, msg: '' };
  player.up = false; player.y = GROUND - player.h;
}
function lockShot() {
  if (state !== S.DUNK_MINIGAME || dk.ph !== 'aim') return;
  dk.ok = dk.m >= dk.z0 && dk.m <= dk.z1; dk.ph = 'fly'; dk.t = 0; player.up = true; sfx.shoot();
}
function updateDunk() {

/* ---------- 13b. CORRIDA ONLINE (capability "room": presença em tempo real) ---------- */
let mp = null, racePending = false, lobbyMsg = '', lobbyLv = 1;
const codeEl = document.getElementById('code');
const mpOpp = () => mp && mp.peers.find(p => !p.isMe && p.presence && p.presence.pi != null);
// Escolhe o transporte: capability "room" dentro do claude.ai, ou WebSocket quando hospedado com server.js
async function getRoom(code) {
  if (window.claude && claude.use) {
    const R = await claude.use('room');
    if (!R) throw new Error('Sala em tempo real indisponível aqui (abra o link pelo claude.ai ou use a versão com servidor)');
    try { return await R.join('nba-' + code); }
    catch (e) { return lobbyRoom(R, code); } // sem salas nomeadas: usa o lobby compartilhado filtrando pelo código
  }
  return wsRoomApi().join('nba-' + code);
}
function lobbyRoom(R, code) {
  const ok = x => x.presence && x.presence.rc === code;
  return { presence: p => R.presence({ ...p, rc: code }), peers: () => R.peers().filter(ok),
    onPeers: h => R.onPeers(c => h({ peers: c.peers.filter(ok) })), leave: () => R.presence({ rc: null, pi: null, x: null }) };
}
// Adaptador WebSocket com a mesma interface da capability "room" (join/presence/onPeers/leave)
function wsRoomApi() {
  return { join: name => new Promise((res, rej) => {
    if (!location.host) return rej(new Error('Abra o jogo pelo endereço do servidor (npm start), não pelo arquivo'));
    let ws; try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host); } catch (e) { return rej(e); }
    let hs = [], me = null, peers = [];
    const room = {
      presence: async patch => { if (ws.readyState === 1) ws.send(JSON.stringify({ t: 'p', d: patch })); },
      onPeers: h => { hs.push(h); return () => { hs = hs.filter(x => x !== h); }; },
      peers: () => peers, leave: async () => ws.close()
    };
    ws.onopen = () => ws.send(JSON.stringify({ t: 'join', room: name }));
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === 'welcome') { me = m.id; res(room); }
      else if (m.t === 'full') rej(new Error('full'));
      else if (m.t === 'peers') { peers = m.peers.map(p => ({ peer: p.id, isMe: p.id === me, sameTab: p.id === me, kind: 'viewer', guest: false, presence: p.presence || {} })); hs.forEach(h => h({ peers })); }
    };
    ws.onerror = () => rej(new Error('Servidor WebSocket não encontrado')); setTimeout(() => rej(new Error('Tempo esgotado ao conectar')), 8000);
  }) };
}
async function joinRoom(code, host) {
  code = code.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6);
  if (mp || lobbyMsg === 'Conectando...') return;
  if (code.length < 3) { lobbyMsg = 'Digite um código válido'; return; }
  lobbyMsg = 'Conectando...';
  try {
    const room = await getRoom(code);
    mp = { room, code, host, peers: [], go: 0, rt: 0, cd: 0, fin: 0, lv: 1, th: selT, miss: 0, hadOpp: 0 };
    room.onPeers(c => { if (mp) mp.peers = c.peers.filter(p => p.kind === 'viewer'); });
    mpSend(); lobbyMsg = '';
  } catch (e) { lobbyMsg = e && e.message === 'full' ? 'Sala cheia' : ('Erro: ' + String((e && (e.message || e.code)) || 'desconhecido').slice(0, 70)); }
}
function leaveRoom() { if (mp) { mp.room.leave().catch(() => {}); mp = null; } lobbyMsg = ''; }
function startOrLobby() { if (racePending) { state = S.LOBBY; lobbyMsg = ''; } else startGame(); }
function hostStart() { mp.go++; startRace(lobbyLv, selT); }
function startRace(lv, th) { // todos usam a mesma fase (semente) e o mesmo tema
  selT = (th | 0) % 3; mp.lv = lv; mp.th = selT; mp.fin = 0; mp.rt = 0; mp.cd = 180; mp.miss = 0; mp.hadOpp = mpOpp() ? 1 : 0;
  score = 0; lives = 3; loadLevel(Math.min(10, Math.max(1, lv | 0)));
}
function raceResult() { // 'win' | 'lose' | 'draw' | null (ainda indefinido)
  const o = mpOpp(), of = o ? o.presence.fin || 0 : 0, f = mp.fin;
  if (f > 0) return of > 0 && of < f ? 'lose' : 'win';
  if (f === -1) return of > 0 ? 'lose' : of === -1 ? 'draw' : null;
  return null;
}
function mpTick() {
  if (!mp) return;
  const o = mpOpp(), racing = state === S.PLAYING || state === S.DUNK_MINIGAME;
  if (o) mp.hadOpp = 1;
  if (state === S.GAME_OVER) { state = S.RACE_END; mp.fin = -1; } // sem vidas = eliminado
  if (racing && mp.cd <= 0) { // vitória por W.O.: adversário eliminado ou desconectado
    mp.miss = o ? 0 : mp.miss + 1;
    if ((o && o.presence.fin === -1) || (mp.hadOpp && mp.miss > 300)) { mp.fin = Math.max(1, mp.rt); state = S.RACE_END; }
  }
  if (!mp.host && (state === S.LOBBY || state === S.RACE_END)) { // convidado segue o "go" do anfitrião
    const h = mp.peers.find(p => p.presence && p.presence.host === 1);
    if (h && h.presence.go > mp.go) { mp.go = h.presence.go; startRace(h.presence.lv, h.presence.th); }
  }
  if (frame % 6 === 0) mpSend(); // ~10 envios/s
}
function mpSend() {
  const r = (state === S.PLAYING || state === S.DUNK_MINIGAME || state === S.RACE_END) && player, p = player;
  const m = { pi: selP, host: mp.host ? 1 : 0, lv: mp.lv, th: mp.th, go: mp.go, fin: mp.fin };
  if (r) Object.assign(m, { x: Math.round(p.x), y: Math.round(p.y), f: p.face, a: +p.anim.toFixed(1), c: Math.round(cam), u: p.up ? 1 : 0, i: p.inv > 0 ? 1 : 0, li: lives, sc: score,
    e: enemies.filter(e => Math.abs(e.x - cam - 480) < 560).slice(0, 12).map(e => [Math.round(e.x), Math.round(e.y), e.type === 'koopa' ? 1 : 0]),
    b: shots.slice(0, 8).map(b => [Math.round(b.x), Math.round(b.y), b.own === 'p' ? 1 : 0]) });
  else Object.assign(m, { x: null, e: null, b: null });
  mp.room.presence(m).catch(() => {});
}
const miniEnemy = new Enemy(0, 0, 'goomba', 0, 0);
function drawMini(p) { // mini tela do adversário (canto superior direito), mesma fase vista pela câmera dele
  if (typeof p.x !== 'number' || typeof p.c !== 'number' || !PLAYERS[p.pi]) return;
  const X = W - 298, Y = 48, w = 288, h = 162, sv = cam;
  ctx.save(); ctx.beginPath(); ctx.rect(X, Y, w, h); ctx.clip();
  ctx.save(); ctx.translate(X, Y); ctx.scale(.3, .3);
  cam = p.c; drawBackground(); drawPlats(); drawHoop();
  for (const e of Array.isArray(p.e) ? p.e : []) { miniEnemy.x = e[0]; miniEnemy.y = e[1]; miniEnemy.type = e[2] ? 'koopa' : 'goomba'; miniEnemy.vx = -1; miniEnemy.draw(); }
  for (const b of Array.isArray(p.b) ? p.b : []) drawBall(b[0] - cam, b[1], 8, frame * .25, b[2] ? '#e65c00' : '#7b1fa2');
  ctx.globalAlpha = p.i && frame % 8 < 4 ? .4 : 1;
  drawPlayer(PLAYERS[p.pi], p.x - cam, p.y, p.f < 0 ? -1 : 1, +p.a || 0, !!p.u, 1);
  ctx.restore(); cam = sv;
  ctx.fillStyle = '#000a'; ctx.fillRect(X, Y + h - 20, w, 20);
  txt(`${PLAYERS[p.pi].name}   ♥${p.li | 0}   ${p.sc | 0} pts`, X + 8, Y + h - 6, 13, '#fff', 'left');
  ctx.restore(); ctx.strokeStyle = '#fdb927'; ctx.lineWidth = 3; ctx.strokeRect(X, Y, w, h);
}
function drawLobby() {
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, W, H); txt('CORRIDA ONLINE', W / 2, 60, 40, '#fdb927');
  if (!mp) { btn(380, 140, 200, 56, '#2563eb', 'CRIAR SALA', 20); txt('ou entre com o código do amigo:', W / 2, 300, 18, '#cbd5e1', 'center', 'normal'); btn(510, 330, 110, 44, '#10b981', 'ENTRAR', 18); }
  else {
    const o = mpOpp(); txt(`SALA: ${mp.code.toUpperCase()}`, W / 2, 120, 44); txt('Compartilhe o código com seu adversário', W / 2, 150, 16, '#94a3b8', 'center', 'normal');
    [[PLAYERS[selP], 240, 'Você'], [o && PLAYERS[o.presence.pi], 620, 'Adversário']].forEach(([d, x, l]) => {
      ctx.fillStyle = '#1e293b'; rr(x - 30, 185, 190, 200, 14); txt(l, x + 65, 212, 18, '#cbd5e1');
      if (d) { drawPlayer(d, x + 47, 235, 1, 0, false, 2); txt(d.name, x + 65, 370, 18); } else txt('aguardando...', x + 65, 300, 16, '#64748b', 'center', 'normal');
    });
    if (mp.host) {
      txt(`FASE ${lobbyLv} • ${THEMES[selT].name}`, W / 2, 430, 20); txt('◄', 350, 432, 30, '#ffea00'); txt('►', 610, 432, 30, '#ffea00');
      btn(380, 455, 200, 50, o ? '#10b981' : '#475569', 'INICIAR CORRIDA', 18);
    } else txt('Aguardando o anfitrião iniciar...', W / 2, 440, 20, '#cbd5e1');
  }
  btn(20, 490, 100, 36, '#475569', 'VOLTAR', 14); if (lobbyMsg) txt(lobbyMsg, W / 2, 530, 16, '#fca5a5');
}
function drawRaceEnd() {
  drawWorld(); drawNet(0); drawHUD();
  const r = raceResult(), T = { win: ['VOCÊ VENCEU!', '#00e676'], lose: ['VOCÊ PERDEU', '#ff5252'], draw: ['EMPATE', '#ffd54f'] }[r] || ['ELIMINADO', '#ff5252'];
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(300, 170, 360, 270);
  txt(T[0], W / 2, 235, 40, T[1]);
  txt(r ? (mp.fin > 0 ? `Seu tempo: ${(mp.fin / 60).toFixed(1)}s` : '') : 'Aguardando o adversário terminar...', W / 2, 275, 18, '#e2e8f0', 'center', 'normal');
  if (mp.host) btn(380, 330, 200, 50, '#2563eb', 'REVANCHE', 20); else txt('Aguardando o anfitrião (revanche)...', W / 2, 358, 16, '#cbd5e1', 'center', 'normal');
  btn(380, 390, 200, 44, '#475569', 'SAIR', 18);
}

/* ---------- 14. LOOP PRINCIPAL (passo fixo de 60 Hz, igual em qualquer monitor) ---------- */
function update() {
  frame++; mpTick();
  if (state === S.PLAYING) updatePlaying(); else if (state === S.DUNK_MINIGAME) updateDunk();
  else if (state === S.VICTORY && frame % 3 === 0) confetti(Math.random() * W, -10, 3, true);
  updateParts();
}
function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === S.MENU) drawMenu(); else if (state === S.SELECTION) drawSelect();
  else if (state === S.PLAYING) { drawWorld(); drawNet(0); drawHUD(); }
  else if (state === S.DUNK_MINIGAME) drawDunk();
  else if (state === S.GAME_OVER) drawGameOver(); else if (state === S.VICTORY) drawVictory();
  else if (state === S.LOBBY) drawLobby(); else if (state === S.RACE_END) drawRaceEnd();
  if (mp && (state === S.PLAYING || state === S.DUNK_MINIGAME || state === S.RACE_END)) { const o = mpOpp(); if (o) drawMini(o.presence); } // mini tela do adversário
  codeEl.style.display = state === S.LOBBY && !mp ? 'block' : 'none';
}
let last = 0, acc = 0;
function loop(t) {
  acc += Math.min(t - last, 100); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
